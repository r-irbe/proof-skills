id: lean-applied-reasoning-smoke
ensemble_rubric: lean-proof-quality
title: Investigative reasoning step (Lean 4 structure)
skill: lean-knowledge-formalization
difficulty: easy
input:
  prompt: 'Write a Lean 4 `structure InfRule` for one inferential step in an evidence-chain.

    Fields: `premises : List Evidence`, `conclusion : Hypothesis`, `weight : EvidenceWeight`.

    Reply with the Lean 4 code only — no prose.

    '
  expected_output_substring: "structure InfRule where\n  premises : List Evidence\n\
    \  conclusion : Hypothesis\n  weight : EvidenceWeight\n"
expected:
  contains:
  - structure\s+InfRule
  - premises
  - conclusion
  - weight
  not_contains:
  - sorry
  - admit
grader: deterministic
tags:
- lean
- applied
- investigation
