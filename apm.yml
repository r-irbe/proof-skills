# apm.yml -- Agent Package Manager manifest for proof-skills
# Spec: https://github.com/microsoft/apm
name: proof-skills
version: 0.3.0
description: "First-party toolkit of 65 active v2 skills, 5 Role-Actor Containers, 23 soul overlays, 6-prover concordance (CONC-01..20), and modular template packs for Lean 4 formalization, AI/KRR reasoning, and cross-ITP verification."
author: "Radu Irbe"
license: Apache-2.0
type: hybrid

# First-party skill packs & modular APM profiles:
#   - core: Core Lean 4 proving, repair, build, setup, bisect, MWE, and kernel optimization
#   - math: Unified Lean 4 mathematical domain skills (foundations, discrete, stochastic, dynamical, optimization, analysis, competitive, convergence)
#   - ai: Verifiable AI, causal/deontic reasoning, KRR, bigraphs, nested learning, security, and applied reasoning
#   - governance: Review/Research councils, enforcement, axiom closure, tautology triage, RETRO, Zettelkasten, and upstream porting
#   - multi-prover: Cross-ITP concordance router and dialect adapters (Lean 4, Rocq, Isabelle, HOL Light, Agda, Metamath)
#   - pack-arithmetic-geometry: 131 ModularJacobian & FLT templates in templates/packs/arithmetic-geometry/
#   - pack-fluid-pde: 10 Fluid PDE templates in templates/packs/fluid-pde/
#   - pack-altproof: Standalone AltProof Lean 4 Lake package (packages/altproof/) & Python CLI (scripts/lean/altproof/pyproject.toml)
profiles:
  core:
    description: "Core Lean 4 proving, specification, proof repair, build, and SAIR kernel optimization."
    agents:
      - agents/specifier.md
      - agents/prover.md
    skills:
      - skills/lean-gateway
      - skills/lean-specification
      - skills/lean-blueprint
      - skills/lean-proof
      - skills/lean-proof-repair
      - skills/lean-core-only
      - skills/lean-build
      - skills/lean-setup
      - skills/lean-bisect
      - skills/lean-mwe
      - skills/counterexample-first-proving
      - skills/lean-sair-kernel-optimization
    templates:
      - templates/Template_*.lean
      - templates/Template_*.md
    packages:
      - packages/altproof
      - scripts/lean/altproof/pyproject.toml
  math:
    description: "Unified Lean 4 mathematical formalization skills and 3-table lookup handbooks."
    agents:
      - agents/specifier.md
      - agents/prover.md
    skills:
      - skills/lean-math-foundations
      - skills/lean-math-discrete
      - skills/lean-math-stochastic
      - skills/lean-math-dynamical
      - skills/lean-math-optimization
      - skills/lean-math-analysis
      - skills/lean-competitive-math
      - skills/lean-convergence-verification
  ai:
    description: "Formal AI safety, causal/deontic reasoning, knowledge formalization, bigraphs, nested learning, and security."
    agents:
      - agents/specifier.md
      - agents/prover.md
    skills:
      - skills/lean-ai-formalization
      - skills/lean-causal-reasoning
      - skills/lean-knowledge-formalization
      - skills/lean-applied-reasoning
      - skills/lean-bigraph-modeling
      - skills/lean-nested-learning
      - skills/lean-security-formalization
      - skills/ai-guard-judge-eval
  governance:
    description: "Read-only auditing, axiom lockdown, Review/Research Councils, pedagogical exposition, RETRO, and Zettelkasten."
    agents:
      - agents/auditor.md
      - agents/editor.md
      - agents/gardener.md
    skills:
      - skills/lean-proof-review
      - skills/lean-enforcement
      - skills/lean-axiom-closure
      - skills/lean-replay-verification
      - skills/lean-tautology-triage
      - skills/lean-quality-engine
      - skills/lean-review-council
      - skills/lean-deep-audit
      - skills/lean-retroactive-audit
      - skills/lean-proof-refactor
      - skills/lean-pedagogical-exposition
      - skills/lean-report
      - skills/lean-doc-improvement
      - skills/lean-doc-requirements
      - skills/lean-doc-feedback
      - skills/lean-research
      - skills/lean-package-research
      - skills/epistemic-discovery-engine
      - skills/epistemic-mapping
      - skills/research-council
      - skills/research-synthesis-engine
      - skills/lean-retro-methodology
      - skills/lean-zettelkasten
      - skills/lean-upstream-porting
      - skills/lean-pr
      - skills/lean-vendor-substrate
      - skills/lean-formalization-breakdown
      - skills/lean-dag-visualizer
      - skills/lean-integration-protocol
      - skills/math-project-management
      - skills/math-product-management
      - skills/math-strategy-studio
      - skills/applied-engineering-disciplines
      - skills/applied-legal-reasoning
      - skills/applied-data-information-security
  multi-prover:
    description: "6-prover concordance (CONC-01..20) and dialect adapters for Rocq, Isabelle/Isar, HOL Light, Agda, and Metamath."
    agents:
      - agents/prover.md
    skills:
      - skills/itp-cross-porting
      - skills/rocq-proof-adapter
      - skills/isabelle-isar-adapter
      - skills/hol-metamath-adapter
    dialects:
      - references/dialects/lean4.json
      - references/dialects/rocq.json
      - references/dialects/isabelle.json
      - references/dialects/hol_light.json
      - references/dialects/agda.json
      - references/dialects/metamath.json
  pack-arithmetic-geometry:
    description: "131 ModularJacobian, Euler System, Heegner Point, and FLT templates."
    templates:
      - templates/packs/arithmetic-geometry/*.md
  pack-fluid-pde:
    description: "10 Fluid PDE, Vorticity, Gevrey Class, and Reynolds Cascade templates."
    templates:
      - templates/packs/fluid-pde/*.md
  pack-altproof:
    description: "Standalone AltProof Lean 4 meta-tactic Lake package (`packages/altproof/`) and Python analysis CLI (`scripts/lean/altproof/pyproject.toml`)."
    skills:
      - skills/lean-proof
      - skills/lean-proof-refactor
      - skills/lean-sair-kernel-optimization
    packages:
      - packages/altproof
      - scripts/lean/altproof/pyproject.toml

dependencies:
  apm: []
  mcp:
    - name: lean-lsp
      registry: false
      transport: stdio
      command: node
      args:
        - "${PROOF_SKILLS_ROOT}/tools/lean-lsp-mcp/dist/index.js"
      description: "Bundled Lean 4 LSP + .ilean + Kuzu knowledge-graph MCP server (14 consolidated tools across 6 prover families)"

scripts:
  setup: "bash scripts/setup-env.sh"
  doctor: "bash scripts/setup-env.sh --doctor"
  validate: "python3 scripts/lint/apm_validate.py --strict"
  conformance: "python3 scripts/skill-audit/check_conformance.py --fail-on any"
  structure: "python3 scripts/check-structure --strict"
  zk-lint: "python3 scripts/lean/zettelkasten_lint.py --zk-dir zettelkasten --strict"
